<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07080a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Museo virtual de arte urbano, graffiti y creación colectiva." />
  <title>Museo Virtual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/intro.css" />
</head>
<body>
  <div class="start-screen" id="start-screen">
    <div class="start-wall" aria-hidden="true">
      <img src="assets/img/logos/mural.jpeg" alt="" />
    </div>
    <div class="start-grime" aria-hidden="true"></div>
    <div class="start-brick" aria-hidden="true"></div>
    <div class="start-haze" aria-hidden="true"></div>
    <div class="neon-light neon-light--pink" aria-hidden="true"></div>
    <div class="neon-light neon-light--magenta" aria-hidden="true"></div>
    <div class="start-splats" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="start-clouds" aria-hidden="true"></div>
    <svg class="start-scribbles" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <path d="M20 90 C80 70 40 140 110 120 C160 105 90 180 40 200" fill="none" stroke="#ff2e88" stroke-width="3" stroke-linecap="round"/>
      <path d="M300 80 C340 120 280 160 360 190 C310 220 370 250 320 280" fill="none" stroke="#f2ece0" stroke-width="2" opacity=".35" stroke-linecap="round"/>
      <path d="M30 520 C90 500 70 580 140 560 C40 600 120 640 60 660" fill="none" stroke="#ff4d9a" stroke-width="4" opacity=".4" stroke-linecap="round"/>
      <circle cx="70" cy="240" r="18" fill="#ff2e88" opacity=".25"/>
      <circle cx="330" cy="480" r="28" fill="#ff2e88" opacity=".18"/>
      <circle cx="350" cy="140" r="8" fill="#f2ece0" opacity=".2"/>
    </svg>
    <canvas class="start-fx" id="start-fx" aria-hidden="true"></canvas>
    <div class="start-sparks" aria-hidden="true"></div>
    <img class="start-logo" src="assets/img/logos/narramuros-logo.png" alt="Narra Muros" />
    <button class="start-btn" id="start-btn" type="button"><span>Toca para comenzar</span></button>
  </div>

  <main class="intro" id="intro">
    <div class="camera" id="camera">
      <div class="wall-bg" id="wall-bg">
        <img src="assets/img/logos/mural.jpeg" alt="" />
        <div class="wall-grade" aria-hidden="true"></div>
        <div class="wall-depth" aria-hidden="true"></div>
      </div>

      <div class="urban-neons" aria-hidden="true">
        <span class="urban-neon urban-neon--cyan"></span>
        <span class="urban-neon urban-neon--pink"></span>
        <span class="urban-neon urban-neon--ground"></span>
      </div>

      <div class="scene">
        <canvas class="spray-canvas" id="spray-canvas"></canvas>
        <div class="scene-atmosphere" aria-hidden="true"></div>
        <div class="scene-glow" aria-hidden="true"></div>
        <div class="paint-glow" id="paint-glow" aria-hidden="true"></div>
        <div class="impact-ring" aria-hidden="true"></div>

        <div class="spray-can" id="spray-can">
          <div class="can-body" id="can-body">
            <span class="spray-cone" aria-hidden="true"></span>
            <span class="can-shine" aria-hidden="true"></span>
            <img src="assets/img/logos/lata.png" alt="" />
          </div>
        </div>

        <div class="brand-lockup">
          <div class="logo-main" id="logo-main">
            <span class="logo-halo" aria-hidden="true"></span>
            <img src="assets/img/logos/narramuros-logo.png" alt="Narra Muros — Arte urbano como herramienta de transformación social" />
          </div>

          <div class="drips" aria-hidden="true"></div>

          <div class="stickers">
            <div class="sticker sticker--disbo">
              <img src="assets/img/logos/disbo-logo.png" alt="DISBo — Distrito de innovación social, Bogotá" />
            </div>
            <div class="sticker sticker--pcis">
              <img src="assets/img/logos/PCIS.png" alt="PCIS — Parque Científico de Innovación Social" />
            </div>
            <div class="sticker sticker--raya">
              <img src="assets/img/logos/raya-logo.png" alt="Raya" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="cinematic-flash" aria-hidden="true"></div>
    <div class="fade-overlay" aria-hidden="true"></div>
    <button class="skip-intro" id="skip-intro" type="button">Saltar intro</button>
  </main>

  <audio id="spray-audio" src="assets/audio/audio-lata.mp3" preload="auto"></audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/intro.js"></script>
</body>
</html>
