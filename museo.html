<!doctype html>
<html lang="es" class="page-museo-root">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050608">
  <title>Obras | Museo Virtual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rubik+Wet+Paint&family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/platform.css">
  <link rel="stylesheet" href="css/obras.css">
</head>
<body class="page-museo">
  <div class="page-transition" aria-hidden="true"></div>
  <div class="cursor" aria-hidden="true"></div>
  <div class="cursor-dot" aria-hidden="true"></div>

  <!-- ===== Callejón: pared, piso mojado, tubos de neón, niebla ===== -->
  <div class="alley" aria-hidden="true">
    <div class="alley__wall"></div>
    <div class="alley__neon alley__neon--cyan"></div>
    <div class="alley__neon alley__neon--magenta"></div>
    <div class="alley__floor"></div>
    <div class="alley__spot"></div>
    <div class="alley__mist"></div>
  </div>
  <canvas class="fx-canvas" aria-hidden="true"></canvas>

  <header class="site-header">
    <a class="brand" href="home.html">
      <img src="assets/img/logos/narramuros-logo.png" alt="">
      Museo <span>Virtual</span>
    </a>
    <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav" aria-label="Abrir menú">
      <span></span><span></span>
    </button>
    <nav id="site-nav" data-site-nav aria-label="Navegación principal"></nav>
  </header>

  <main class="alley-main">

    <!-- ===== Bloque de título: arriba a la izquierda ===== -->
    <div class="alley-head">
      <p class="gallery-kicker">
        <span class="gallery-kicker__dot"></span>
        <span>Engativá, Bogotá</span>
        <i aria-hidden="true"></i>
        <span>Sala abierta · 18 obras</span>
      </p>

      <h1 class="alley-title" aria-label="Los jóvenes narran su territorio a través del arte">
        <span class="alley-title__line" aria-hidden="true">
          <span class="w"><b>Los</b></span>
          <span class="w"><b>jóvenes</b></span>
          <span class="w"><b>narran</b></span>
          <span class="w"><b>su</b></span>
          <span class="w"><b>territorio</b></span>
        </span>
        <span class="alley-title__line alley-title__line--tail" aria-hidden="true">
          <span class="w"><b>a</b></span>
          <span class="w"><b>través</b></span>
          <span class="w"><b>del</b></span>
        </span>
        <span class="alley-title__tag" aria-hidden="true"><span class="w"><b>Arte</b></span></span>
      </h1>
    </div>

    <!-- ===== Galería 3D circular ===== -->
    <section class="gallery" data-gallery aria-label="Galería de obras">
      <div class="gallery__stage" data-stage>
        <div class="gallery__tilt" data-tilt>
          <div class="gallery__ring" data-ring></div>
        </div>
      </div>

      <div class="gallery__hud">
        <button class="hud__arrow" type="button" data-prev aria-label="Obra anterior">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8"/></svg>
        </button>

        <div class="hud__meter">
          <div class="hud__count"><span data-index>01</span><i>/</i><span data-total>18</span></div>
          <div class="hud__track"><span data-progress></span></div>
          <p class="hud__hint">Gira el muro: arrastra, desliza o usa ← →. Toca la obra para verla completa.</p>
        </div>

        <button class="hud__arrow" type="button" data-next aria-label="Obra siguiente">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg>
        </button>
      </div>
    </section>
  </main>

  <!-- ===== Lightbox ===== -->
  <div class="lightbox" data-lightbox hidden>
    <div class="lightbox__card" role="dialog" aria-modal="true" aria-label="Obra ampliada">
      <button class="lightbox__close" type="button" data-lightbox-close aria-label="Cerrar">✕</button>
      <div class="lightbox__img"><img data-lightbox-img alt=""></div>
      <div class="lightbox__meta">
        <h2 data-lightbox-title></h2>
        <p data-lightbox-author></p>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/museo-data.js"></script>
  <script src="js/site.js"></script>
  <script src="js/obras.js"></script>
</body>
</html>
